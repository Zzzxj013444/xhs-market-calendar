<script>
(() => {
  const key = 'xhs-market-calendar:demo:v2';
  const legacyKey = 'codex:visualization-widget-state-v2:' + JSON.stringify([location.pathname, location.search]);
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(key) || localStorage.getItem(legacyKey) || 'null'); } catch {}
  window.openai = {
    widgetState: saved,
    async setWidgetState(next) {
      const snapshot = JSON.parse(JSON.stringify(next));
      this.widgetState = snapshot;
      try { localStorage.setItem(key, JSON.stringify(snapshot)); } catch {}
    }
  };
  window.addEventListener('storage', event => {
    if (event.key !== key) return;
    try {
      const snapshot = JSON.parse(event.newValue || 'null');
      window.openai.widgetState = snapshot;
      window.dispatchEvent(new CustomEvent('openai:set_globals', {detail: {globals: {widgetState: snapshot}}}));
    } catch {}
  });
})();
</script>

function marketCard(id){const p=products[id];let copy='';if(id==='tee')copy=`<h3><span class="aj-night-tag">星光夜市</span>1JINN STUDIO · 猫咪印花长袖</h3><p class="aj-card-offer">星光抵扣16.91元&nbsp; 仅剩2件</p><div class="aj-market-price"><span>星光价 ¥<b>152</b><strong>.24</strong></span><small>已售186</small></div>`;else if(id==='ring')copy=`<p class="aj-buyer-quote"><span>❀</span>“非常豪看！发货超级快”</p><h3>MERAKI · 电吉他开口戒</h3><p class="aj-card-muted">1.7万+人加购&nbsp; 退货包运费</p><div class="aj-market-price"><span>关注后 ¥<b>16</b></span><small>已售4316</small></div>`;else copy=`<h3>${p.name}</h3><p class="aj-card-muted">${p.seller} · ${p.note}</p><div class="aj-market-price"><span>¥<b>${p.price}</b></span><small>${state.now>=releaseOf(p)?'现在可选购':'即将上新'}</small></div>`;return button('product',`${art(id)}<div class="aj-market-card-copy">${copy}</div>`,'aj-market-card',id,`aria-label="${p.name}，¥${p.price}"`);}
function market(){let columns=[['tee','coat','scarf'],['ring','mug','vase','lamp']];if(state.channel==='fashion')columns=[['tee','scarf'],['ring','coat','bag']];if(state.channel==='home')columns=[['mug','tray'],['lamp','vase']];if(state.channel==='redone')columns=[['tee','coat'],['ring','bag']];if(['beauty','food','sports'].includes(state.channel))columns=[[],[]];return `${marketHeader('market')}<section class="aj-market-shortcuts" aria-label="市集功能">${marketShortcuts.map(item=>button(item.id==='cart'?'bag':'feature',`<img src="${item.image}" alt="" draggable="false"><span>${item.label}</span>`,'aj-market-shortcut',item.id)).join('')}</section>${state.channel==='recommend'?`<div class="aj-recommend-promo">${arrivalsBanner()}</div>`:''}<section class="aj-market-feed" aria-label="推荐商品">${columns.some(c=>c.length)?columns.map(items=>`<div class="aj-market-column">${items.map(marketCard).join('')}</div>`).join(''):`<div class="aj-market-empty">${empty('好物正在陆续上架','先去推荐里，逛逛日常喜欢的好物。','market','返回推荐')}</div>`}</section>${nav()}`;}
function searchResults(){const q=state.searchQuery.trim().toLowerCase();const ids=Object.keys(products).filter(id=>!q||`${products[id].name} ${products[id].seller} ${products[id].note}`.toLowerCase().includes(q));return ids.length?ids.map(productRow).join(''):'<div class="aj-empty"><h3>暂时没有找到相关商品</h3><p>试试“杯”“外套”或店铺名称。</p></div>';}
function featureContent(id){if(id==='live')return `<p class="aj-sheet-copy">关注喜欢的买手，也看看这一期的新选品。</p><div class="aj-feature-person">${avatar('buyer')}<div><h3>阿梨的生活选物</h3><p class="aj-subtle">11.12 20:30 · 生活好物选品</p></div></div>${button('event','看看本期选品','aj-primary aj-full','buyer')}`;if(id==='fans')return `<p class="aj-sheet-copy">订阅喜欢的店和人，下次上新一起看。</p>${button('subscribe','选择想订阅的店和人','aj-primary aj-full aj-feature-cta')}`;if(id==='orders')return state.orders.length?state.orders.map((o,i)=>`<div class="aj-order-summary"><h3>订单 ${i+1} · 已完成</h3><p>${o.items.map(item=>products[item.pid].name).join('、')}</p><strong>合计 ¥${o.total}</strong></div>`).join(''):'<div class="aj-empty"><h3>还没有订单</h3><p>去市集逛逛，发现下一件喜欢的好物。</p></div>';if(id==='history')return state.history.length?state.history.map(productRow).join(''):'<div class="aj-empty"><h3>还没有浏览足迹</h3><p>看过的商品会出现在这里。</p></div>';if(['night','group','goods'].includes(id))return (id==='night'?['tee','ring']:['mug','lamp','tray']).map(productRow).join('');const copy={coupon:['暂无可用优惠券','逛逛喜欢的店，发现新的好物。'],service:['暂无客服消息','与商家联系后，可在这里继续会话。'],home:['逛逛喜欢的内容','这次先去市集，发现喜欢的店和人。'],profile:['我的市集','管理喜欢的店铺、买手和心动好物。'],publish:['分享你的日常好物','先收藏喜欢的单品，下次再来看看。']}[id]||['市集','去发现喜欢的好物。'];return `<div class="aj-empty"><h3>${copy[0]}</h3><p>${copy[1]}</p>${id==='profile'?button('manage','管理我的上新订阅','aj-primary'):button('market','去逛市集','aj-primary')}</div>`;}
function subscribe(){return `${stageTop('选择上新订阅','market','manage')}<div class="aj-body"><div class="aj-intro-title">想看谁的下一次上新？</div><div class="aj-intro-copy">这些是你已关注、且发布商品更新的账号。<br>选择后，在市集集中看它们的上新与选品。</div>${Object.values(owners).map(o=>`<div class="aj-candidate"><label>${avatar(o.id)}<span class="aj-person-info"><span class="aj-person-name">${o.name}<span class="aj-kind">${o.kind}</span></span><span class="aj-person-meta">${o.relation}</span></span><input type="checkbox" class="aj-check" data-action="draft" data-value="${o.id}" aria-label="订阅${o.name}的${o.sub}" ${state.draft.includes(o.id)?'checked':''}></label><div class="aj-candidate-preview">${art(o.products[0])}${art(o.products[1])}<p>${o.sub}<br>${o.brief}</p></div></div>`).join('')}</div><div class="aj-footer-action">${button('confirmSubs',`加入我的上新${state.draft.length?`（${state.draft.length}）`:''}`,'aj-primary aj-full','',state.draft.length?'':'disabled')}<p class="aj-subtle">账号关注保持原样；单次开售提醒另外设置。</p>${button('skip','先逛逛，稍后再选','aj-text-link')}</div>`;}
function gallery(ev,prices=true){return `<div class="aj-gallery">${ev.pids.map(id=>button('product',art(id)+(prices?`<div class="aj-gallery-price">¥${products[id].price}</div>`:''),'',id,`aria-label="查看${products[id].name}"`)).join('')}</div>`;}
function heartIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>';}
function productHeart(id){const saved=state.saved.includes(id);return button('saveProduct',heartIcon(),'aj-product-heart'+(saved?' saved':''),id,`aria-label="${saved?'取消收藏':'收藏'}${products[id].name}" aria-pressed="${saved}"`);}
function collectionProduct(id){const p=products[id];return `<div class="aj-rail-product">${button('product',`${art(id)}<span class="aj-rail-product-name">${p.name}</span>`,'aj-rail-product-main',id,`aria-label="查看${p.name}"`)}<div class="aj-rail-product-bottom"><span class="aj-rail-price">¥${p.price}</span>${productHeart(id)}</div></div>`;}

function empty(title,copy,action,label){return `<div class="aj-empty"><div class="aj-empty-icon">${ico('calendar-heart')}</div><h3>${title}</h3><p>${copy}</p>${action?button(action,label,'aj-primary'):''}</div>`;}
function publishedLabel(t){const d=Math.floor(t/1440),today=Math.floor(state.now/1440);return `${d===today?'今天':d===today-1?'昨天':'11月'+d+'日'} ${date(t).split(' ')[1]}`;}
function appointmentSummary(){
 const booked=state.reminders.map(id=>events[id]).sort((a,b)=>timeOf(a)-timeOf(b));
 if(!booked.length)return '开售提醒、直播预约，统一记录';
 const next=booked.find(ev=>statusOf(ev)==='upcoming'||statusOf(ev)==='live');
 return next?`下场 ${date(timeOf(next))} · ${owners[next.owner].name}`:`已记录 ${booked.length} 项安排，点开查看`;
}
function calendar(){
 const filtered=Object.values(events).filter(e=>state.subs.includes(e.owner)&&(state.filter==='all'||owners[e.owner].type===state.filter)&&e.publishedAt<=state.now).sort((a,b)=>b.publishedAt-a.publishedAt);
 let lastDay=0;
 const cards=filtered.map(ev=>{const d=Math.floor(ev.publishedAt/1440),today=Math.floor(state.now/1440),heading=d!==lastDay?`<div class="aj-feed-date">${d===today?'今天':d===today-1?'昨天':'11月'+d+'日'}<span>${d===today||d===today-1?'11月'+d+'日':''}</span></div>`:'';lastDay=d;return heading+eventCard(ev);}).join('');

}
function productRow(id){const p=products[id],available=state.now>=releaseOf(p);return `<div class="aj-product-row">${art(id)}<div class="aj-product-info"><h3>${p.name}</h3><p>${p.note}<br>销售店铺：${p.seller}</p><div class="aj-product-price-row"><span class="aj-price">¥${p.price}</span>${button('product',available?'选规格':'看详情','aj-mini-button',id)}</div></div>${button('saveProduct',heartIcon(),'aj-save-button'+(state.saved.includes(id)?' saved':''),id,`aria-label="${state.saved.includes(id)?'取消收藏':'收藏'}${p.name}" aria-pressed="${state.saved.includes(id)}"`)}</div>`;}
function eventPage(){const ev=events[state.event],o=owners[ev.owner],st=statusOf(ev),subbed=state.subs.includes(o.id);return `${stageTop(ev.type==='live'?'买手选品':'本次上新',state.detailBack)}<div class="aj-body" style="padding-top:3px;padding-bottom:14px"><div class="aj-person-row">${avatar(o.id)}<div class="aj-person-info"><div class="aj-person-name">${o.name}<span class="aj-kind">${o.kind}</span></div><div class="aj-person-meta">账号已关注</div></div>${button('toggleSub',subbed?'已订阅':o.type==='buyer'?'订阅选品':'订阅上新','aj-secondary'+(subbed?' selected':''),o.id,`aria-pressed="${subbed}"`)}</div></div>${st==='live'?`<div class="aj-live-panel">${art(ev.pids[0])}<span class="aj-live-label">直播中 · 画面示意</span><div class="aj-live-caption">${o.name}：${o.id==='moge'?'先看看这件外套的长度和搭配。':'先看看这件好物的细节和用法。'}</div></div>`:`<div class="aj-detail-hero">${gallery(ev,false)}</div>`}<div class="aj-detail-heading"><div class="aj-eyebrow">${ev.type==='live'?'CURATED BY '+o.name:'NEW COLLECTION / 初冬'}</div><h2>${ev.title}</h2><p>${ev.desc}${ev.type==='live'?' 你可以先看商品，直播时再听具体的选品理由。':ev.id==='shan'?' 这一批有雾青外套、栗色围巾和轻便的小提袋。':' 杯子、木托盘和小花器，实用之外也有自己的纹理。'}</p><div class="aj-timing">${ico(ev.type==='live'?'video':'calendar-days')}${date(timeOf(ev))} ${ev.type==='live'?'开播':'开售'} · ${statusLabel(ev)}</div>${state.delayed&&ev.id==='shan'?'<div class="aj-old-time">原定 11.13 20:00 开售</div>':''}${ev.type==='live'?'<p style="margin-top:8px">开播时间与商品开售时间独立，已在售商品可直接购买。</p>':''}</div><div class="aj-product-list">${ev.pids.map(productRow).join('')}</div><div class="aj-footer-action">${st==='upcoming'?reminderButton(ev.id,'aj-primary aj-full'):button('bag',ico('shopping-bag')+'查看购物袋','aj-primary aj-full')}<p class="aj-subtle">${st==='upcoming'?'仅提醒本次；订阅上新不会自动开启通知。':ev.type==='live'?'商品按实际销售店铺提供交易与售后服务。':'按实际规格查看库存、价格与发货信息。'}</p></div>`;}
function agendaMonth(){return new Date(2026,10+state.agendaOffset,1);}
function agendaEvents(){return state.reminders.map(id=>events[id]).filter(ev=>state.agendaFilter==='all'||ev.type===state.agendaFilter).sort((a,b)=>timeOf(a)-timeOf(b));}
function openAgenda(){
 const booked=state.reminders.map(id=>events[id]).sort((a,b)=>timeOf(a)-timeOf(b));
 const nearest=booked.find(ev=>statusOf(ev)==='live')||booked.find(ev=>timeOf(ev)>=state.now)||booked[booked.length-1];
 state.agendaOffset=0;state.agendaFilter='all';state.day=nearest?Math.floor(timeOf(nearest)/1440):Math.floor(state.now/1440);go('reminders',2);
}
function appointmentRow(ev){
 const o=owners[ev.owner],st=statusOf(ev),live=ev.type==='live';
 return `<article class="aj-appointment-row" data-appointment="${ev.id}"><time>${date(timeOf(ev)).split(' ')[1]}</time><span class="aj-timeline-line" aria-hidden="true"></span><div class="aj-appointment-content">${button('event',`${avatar(o.id)}<span><strong>${o.name}</strong><small>${ev.title}</small></span>`,'aj-appointment-owner',ev.id)}<div class="aj-appointment-meta"><span class="aj-appointment-type ${live?'is-live':''}">${ico(live?'video':'shopping-bag')}${live?'直播预约':'开售提醒'}</span><span>${statusLabel(ev)}</span></div><div class="aj-appointment-actions">${button('event',st==='live'?'进入直播':live?'查看选品':'查看上新','aj-secondary',ev.id)}${button('cancelReminder',live?'取消预约':'取消提醒','aj-text-link',ev.id,`aria-label="取消${o.name}的${ev.title}${live?'直播预约':'开售提醒'}"`)}</div></div></article>`;

function reminderPage(){

 const inMonth=year===2026&&m===10?all:[],selected=inMonth.filter(ev=>Math.floor(timeOf(ev)/1440)===state.day),today=Math.floor(state.now/1440),isCurrent=year===2026&&m===10;

 const weekday=['日','一','二','三','四','五','六'][new Date(year,m,state.day||1).getDay()];
 return `${stageTop('我的预约日历','calendar','manage')}<section class="aj-month-calendar" aria-label="预约日历"><div class="aj-month-heading"><h3>${year}年<span>${m+1}月</span></h3><div>${button('agendaToday','今天','aj-text-link')}${button('agendaMonth',ico('chevron-left'),'aj-month-nav','-1',`aria-label="上个月" ${state.agendaOffset<=-12?'disabled':''}`)}${button('agendaMonth',ico('chevron-right'),'aj-month-nav','1',`aria-label="下个月" ${state.agendaOffset>=12?'disabled':''}`)}</div></div><div class="aj-calendar-weekdays" aria-hidden="true">${['日','一','二','三','四','五','六'].map(d=>`<span>${d}</span>`).join('')}</div><div class="aj-month-grid" role="group" aria-label="${year}年${m+1}月预约日期">${cells}</div><div class="aj-agenda-filters" role="group" aria-label="预约类型">${[['all','全部'],['launch','开售提醒'],['live','直播预约']].map(([id,label])=>button('agendaFilter',label,'aj-agenda-filter',id,`aria-pressed="${state.agendaFilter===id}"`)).join('')}<span class="aj-agenda-dot-legend"><i></i>有预约</span></div></section><section class="aj-agenda-timeline" aria-label="所选日期的预约"><div class="aj-agenda-day-title"><h3>${m+1}月${state.day||1}日 <span>周${weekday}</span></h3><span>${selected.length} 项安排</span></div>${selected.length?selected.map(appointmentRow).join(''):empty(state.reminders.length?'这一天没有预约':'还没有预约安排',state.reminders.length?'切换日期或月份，查看你期待的开售和直播。':'在上新里点“提醒开售”或“预约直播”，就会记在这里。','calendar','去逛上新')}<p class="aj-agenda-note">只记录你主动设置的提醒与预约</p></section>`;

function groups(items=state.bag){const map={};for(const item of items){const seller=products[item.pid].seller;(map[seller]??=[]).push(item);}return Object.entries(map).map(([seller,items])=>({seller,items,shipping:seller==='山间来信'?0:6}));}

function checkout(){const t=totals();return `${stageTop('确认订单','bag')}<div class="aj-body"><div class="aj-notice neutral">${ico('map-pin')}演示收货地址 · 上海市 · 不填写真实信息</div>${bagGroups(true)}<div class="aj-amount-row"><span>商品金额</span><span>¥${t.subtotal}</span></div><div class="aj-amount-row"><span>按店铺计算运费</span><span>¥${t.shipping}</span></div><div class="aj-amount-row total"><span>合计</span><span class="aj-price">¥${t.total}</span></div><p class="aj-subtle">各店分别发货。符合条件的商品支持 7 天无理由退货，具体以店铺规则为准。</p></div><div class="aj-footer-action">${button('placeOrder','提交模拟订单 · ¥'+t.total,'aj-primary aj-full')}<p class="aj-subtle">仅演示购买流程，不会付款或生成真实订单。</p></div>`;}
function success(){const order=state.orders[state.orders.length-1];return `${stageTop('购买完成','calendar')}<div class="aj-success"><div class="aj-success-icon">${ico('check')}</div><h2>模拟订单已完成</h2><p>从期待一次上新，到选中适合自己的那一件。</p><div class="aj-success-summary"><div class="aj-amount-row"><span>商品数量</span><span>${order.items.length} 件</span></div><div class="aj-amount-row"><span>含运费合计</span><span>¥${order.total}</span></div></div>${button('calendar','回市集，继续看上新','aj-primary aj-full')}${button('manage','管理我的上新订阅','aj-text-link')}<p>本次体验没有发生真实交易。</p></div>`;}
function modal(){if(!state.modal)return '';let title='',content='';if(state.modal==='product'){const p=products[state.product],canBuy=state.now>=releaseOf(p),v=state.variant===null?null:p.variants[state.variant],saved=state.saved.includes(p.id),launch=Object.values(events).find(ev=>ev.pids.includes(p.id)&&timeOf(ev)===releaseOf(p))?.id||Object.values(events).find(ev=>ev.pids.includes(p.id))?.id||'shan';title='商品规格';content=`<div class="aj-sku-head">${art(p.id)}<div><h3>${p.name}</h3><span class="aj-price">¥${p.price}</span><p>销售店铺：${p.seller}</p><p>${canBuy?'已开售':date(releaseOf(p))+' 开售'}</p></div></div><div class="aj-size-label">${canBuy?'选择购买规格':'提前看看规格，开售后再决定'}</div><div class="aj-sizes" role="group" aria-label="商品规格">${p.variants.map((v,i)=>button('variant',v.name+(v.stock===0?' · 售罄':''),'aj-size',String(i),`aria-pressed="${state.variant===i}" ${v.stock===0?'disabled':''}`)).join('')}</div><div class="aj-spec-detail">${v?v.detail:'请选择规格，查看尺寸与库存状态。'}<br>${p.seller==='山间来信'?'本店包邮':'本店运费 ¥6'} · 按实际销售店铺发货</div><div class="aj-sku-actions">${button('saveProduct',heartIcon()+(saved?'已收藏':'收藏'),'aj-secondary'+(saved?' selected':''),p.id,`aria-pressed="${saved}"`)}${canBuy?button('addBag',v?'加入购物袋':'请选择规格','aj-primary','',v&&v.stock?'':'disabled'):reminderButton(launch,'aj-primary')}</div>`;}
else if(state.modal==='noteComments'){title='笔记评论';content='<div class="aj-note-comments"><p><strong>小白的衣橱</strong><span>白色羽绒服搭配深色裙子好好看！</span></p><p><strong>慢慢过冬</strong><span>想看这次直播的针织选品。</span></p><p><strong>小母格</strong><span>周六下午一起慢慢选，日常搭配也会讲到。</span></p></div>';}
else if(state.modal==='unsubscribe'){const o=owners[state.target];title='取消上新订阅';const count=state.reminders.filter(id=>events[id].owner===o.id).length;content=`<div class="aj-person-row" style="margin-bottom:16px">${avatar(o.id)}<div class="aj-person-name">${o.name}</div></div><p class="aj-sheet-copy">取消后，新的${o.sub}不再出现在你的上新动态。<br>你仍然关注「${o.account}」的账号内容。${count?'<br>已设置的单次提醒保留，可在「我的预约日历」里单独取消。':''}</p><div style="margin-top:21px">${button('confirmUnsub','确认取消上新订阅','aj-primary aj-full',o.id)}</div>`;}
else if(state.modal==='search'){title='搜索';content=`<label class="aj-sr" for="aj-product-search">搜索商品或店铺</label><input id="aj-product-search" class="aj-search-input" data-action="searchInput" placeholder="搜索商品或店铺" autocomplete="off"><div class="aj-search-results">${searchResults()}</div>`;}
else if(state.modal==='feature'){title=marketShortcuts.find(item=>item.id===state.target)?.label||({home:'首页',profile:'我',publish:'发布'}[state.target]||'市集');content=featureContent(state.target);}
else if(state.modal==='tools'){title='演示工具';content=`<p class="aj-sheet-copy">概念原型 · 商家与商品均为示例<br>演示时间：${date(state.now)}，通知与交易不会实际发生。</p><div class="aj-tools-heading">选择体验起点</div><div class="aj-tools-stages">${button('home','从首页笔记开始','aj-tools-stage')}${button('market','从市集推荐开始','aj-tools-stage')}</div><div class="aj-tools-heading">切换体验阶段</div><div class="aj-tools-stages">${stepNames.map((name,i)=>button('stage',`<span>${i+1}</span>${name}`,'aj-tools-stage',String(i),`aria-pressed="${state.step===i}"`)).join('')}</div><div class="aj-tools-heading">时间与状态</div><div class="aj-tools-time">${button('advanceLaunch',ico('calendar-check')+'推进至新品开售','aj-secondary')}${button('advanceLive',ico('video')+'查看买手开播','aj-secondary')}${button('toggleDelay',ico('clock-3')+(state.delayed?'恢复原定开售时间':'店铺延期一天'),'aj-secondary')}</div>${button('reset',ico('rotate-ccw')+'重新体验','aj-secondary aj-full aj-tools-reset')}`;}
return `<div class="aj-overlay">${button('close','','aj-shade','','aria-label="关闭弹层背景"')}<section class="aj-sheet" role="dialog" aria-modal="true" aria-labelledby="aj-dialog-title"><div class="aj-sheet-head"><h3 id="aj-dialog-title">${title}</h3>${button('close',ico('x'),'aj-close','','aria-label="关闭弹层"')}</div>${content}</section></div>`;}
function go(screen,step){if(screen==='market'&&state.screen!=='market')state.channel='recommend';state.screen=screen;if(step!==undefined)state.step=step;state.modal=null;}
function notify(message){toast=message;announcer.textContent=message;if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast='';phone.querySelector('.aj-toast')?.remove();},2600);}
function openEvent(id){state.event=id;state.detailBack=state.screen==='reminders'?'remindersBack':'calendar';if(!state.seen.includes(id))state.seen.push(id);if(events[id].type!=='live'){state.store=events[id].owner;go('store',3);return;}go('event',3);}
function openProduct(id){state.history=[id,...state.history.filter(pid=>pid!==id)].slice(0,12);state.product=id;state.variant=null;state.modal='product';}
function setTime(t){state.now=t;state.day=0;state.modal=null;}
function updateRail(rail){
 const count=events[rail.dataset.event].pids.slice(0,9).length;
 const stride=(rail.querySelector('.aj-rail-product')?.getBoundingClientRect().width||0)+8;
 const index=Math.min(Math.max(0,count-1),Math.round(rail.scrollLeft/stride));
 const card=rail.closest('.aj-event');
 const range=card.querySelector('.aj-rail-range');if(range)range.textContent=rail.scrollLeft>=stride*count-2?'更多商品，进店查看':`${index+1}–${Math.min(index+3,count)} / ${count} 件`;
 const prev=card.querySelector('[data-action=railPrev]'),next=card.querySelector('[data-action=railNext]');
 if(prev)prev.disabled=rail.scrollLeft<=2;
 if(next)next.disabled=rail.scrollLeft+rail.clientWidth>=rail.scrollWidth-2;
}
function moveRail(id,direction){const rail=phone.querySelector(`.aj-product-rail[data-event="${id}"]`);if(!rail)return;rail.scrollBy({left:direction*(rail.clientWidth+8),behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'});}
function jump(step){state.step=step;state.modal=null;switch(step){case 0:go(noteEntryStart?'home':'market');break;case 1:state.draft=[...state.subs];go('subscribe');break;case 2:go('calendar');break;case 3:openEvent(state.arrivedFromNote?'moge':'shan');break;case 4:setTime(timeOf(events.shan));go('calendar',4);break;case 5:go('bag');break;case 6:go('manage');break;}}
function focusTo(action,value,event){const scope=state.modal?phone.querySelector('.aj-sheet'):event?phone.querySelector(`.aj-event[data-event-card="${event}"]`):root;const selector=`[data-action="${action}"]${value!==undefined&&value!==''?`[data-value="${value}"]`:''}`;scope?.querySelector(selector)?.focus({preventScroll:true});}
function screenContent(markup){
 if(!standalone)return statusBar()+markup;
 const template=document.createElement('template');template.innerHTML=markup;
 const header=[],body=[],footer=[];
 for(const node of template.content.children){
  if(node.matches('.aj-top,.aj-top-tabs,.aj-market-top,.aj-market-tabs,.aj-home-top'))header.push(node.outerHTML);
  else if(node.matches('.aj-bottom-nav,.aj-footer-action,.aj-note-footer'))footer.push(node.outerHTML);
  else body.push(node.outerHTML);
 }
 return `${statusBar()}<header class="aj-screen-head">${header.join('')}</header><main class="aj-scroll" aria-label="${state.screen==='home'?'首页笔记':state.screen==='note'?'视频笔记':state.screen==='reminders'?'预约日历':stepNames[state.step]}内容">${body.join('')}</main>${footer.length?`<footer class="aj-screen-foot">${footer.join('')}</footer>`:''}`;
}
function render(focus){
 for(const rail of phone.querySelectorAll('.aj-product-rail'))railPositions.set(rail.dataset.event,rail.scrollLeft);
 const previousScroll=phone.querySelector('.aj-scroll');
 if(previousScroll&&renderedScreenKey)scrollPositions.set(renderedScreenKey,previousScroll.scrollTop);
 const key=state.screen+(state.screen==='market'?':'+state.channel:state.screen==='store'?':'+state.store+':'+state.event:state.screen==='event'?':'+state.event:state.screen==='calendar'?':'+state.filter:state.screen==='reminders'?':'+state.agendaOffset+':'+state.day+':'+state.agendaFilter:'');
 rail.innerHTML=stepNames.map((name,i)=>button('stage',`<em>${String(i+1).padStart(2,'0')}</em><span>${name}</span>`,'aj-step',String(i),state.step===i?'aria-current="step"':'')).join('');
 hint.textContent=state.screen==='home'?'点击右下角带演示标记的「小母格」穿搭视频，体验从内容到市集的订阅路径。':state.screen==='note'?'在开播预告的位置订阅买手选品。订阅后可以继续看笔记，也可以选择前往市集。':stepNotes[state.step];clockLabel.textContent='演示时间 '+date(state.now);
 mobileBar.querySelector('span').innerHTML=(state.screen==='home'?'① 点击标记的穿搭视频':state.screen==='note'?'② 订阅买手选品':state.screen==='calendar'&&state.arrivedFromNote?'③ 已进入市集 · 上新':'市集上新')+' <span class="aj-demo-tag">DEMO</span>';
 for(const entry of root.querySelectorAll('.aj-entry-points button'))entry.setAttribute('aria-pressed',String(entry.dataset.action==='home'?['home','note'].includes(state.screen):!['home','note'].includes(state.screen)));
 phone.dataset.page=state.screen;
 const pages={home:homePage,note:notePage,market,subscribe,calendar,store:storePage,event:eventPage,bag,checkout,success,manage,saved:savedPage,reminders:reminderPage};
 phone.innerHTML=`<div class="aj-screen" ${state.modal?'inert':''}>${screenContent(pages[state.screen]())}</div>${modal()}${toast?`<div class="aj-toast" role="status">${toast}</div>`:''}`;
 controls.innerHTML=button('advanceLaunch','演示：推进至新品开售','aj-demo-control')+button('advanceLive','演示：买手开播','aj-demo-control')+button('toggleDelay',state.delayed?'演示：恢复原定时间':'演示：店铺延期一天','aj-demo-control');
 if(standalone){
  phone.querySelector('.aj-scroll').scrollTop=scrollPositions.get(key)||0;
  mobileBar.inert=!!state.modal;rail.parentElement.inert=!!state.modal;controls.inert=!!state.modal;
 }
 for(const rail of phone.querySelectorAll('.aj-product-rail')){rail.scrollLeft=railPositions.get(rail.dataset.event)||0;updateRail(rail);}
 renderedScreenKey=key;
 if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
 if(focus)focusTo(focus.action,focus.value,focus.event);
 if(state.modal&&!standalone)phone.querySelector('.aj-sheet')?.scrollIntoView({block:'center',behavior:'instant'});
}
root.addEventListener('scroll',e=>{if(e.target.matches?.('.aj-product-rail'))updateRail(e.target);},true);
root.addEventListener('input',e=>{if(e.target.dataset.action==='searchInput'){state.searchQuery=e.target.value;phone.querySelector('.aj-search-results').innerHTML=searchResults();if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}});
root.addEventListener('change',e=>{const el=e.target;if(el.dataset.action==='draft'){state.draft=el.checked?[...new Set([...state.draft,el.dataset.value])]:state.draft.filter(id=>id!==el.dataset.value);render({action:'draft',value:el.dataset.value});save();}});
root.addEventListener('click',e=>{const el=e.target.closest('button[data-action]');if(!el||!root.contains(el)||el.disabled)return;const a=el.dataset.action,v=el.dataset.value;let focus={action:a,value:v,event:el.closest('.aj-event')?.dataset.eventCard};
 switch(a){
 case 'tools':focusReturn={action:'tools'};state.modal='tools';focus={action:'close'};break;
 case 'stage':jump(Number(v));focus=standalone&&window.matchMedia('(max-width:700px), (max-width:1000px) and (max-height:500px)').matches?{action:'tools'}:{action:'stage',value:v};break;
 case 'reset':state=defaults();scrollPositions.clear();railPositions.clear();renderedScreenKey='';toast='';if(toastTimer)clearTimeout(toastTimer);focus=noteEntryStart?{action:'openNote'}:{action:'channel',value:'recommend'};break;
 case 'home':state.noteNudge=false;go('home',0);focus={action:'openNote'};break;
 case 'openNote':state.noteNudge=false;go('note',0);focus={action:state.subs.includes('moge')?'noteMarket':'noteSubscribe'};break;
 case 'noteSubscribe':if(!state.subs.includes('moge'))state.subs.push('moge');state.noteNudge=true;announcer.textContent='已订阅小母格的买手选品。可选择去市集看选品，或继续看笔记。';focus={action:'noteMarket'};break;
 case 'stayNote':state.noteNudge=false;focus={action:'noteMarket'};break;
 case 'noteMarket':if(!state.subs.includes('moge'))return;state.noteNudge=false;state.arrivedFromNote=true;state.event='moge';state.filter='all';scrollPositions.delete('calendar:all');go('calendar',2);focus={action:'store',value:'moge',event:'moge'};break;
 case 'noteLike':state.noteLiked=!state.noteLiked;break;
 case 'noteSave':state.noteSaved=!state.noteSaved;break;
 case 'noteComments':focusReturn={action:a};state.modal='noteComments';focus={action:'close'};break;
 case 'market':state.channel='recommend';go('market',0);focus={action:'channel',value:'recommend'};break;
 case 'channel':go('market',0);state.channel=v;focus={action:'channel',value:v};break;
 case 'search':focusReturn={action:'search'};state.searchQuery='';state.modal='search';focus={action:'searchInput'};break;
 case 'feature':focusReturn={action:'feature',value:v};state.target=v;state.modal='feature';focus={action:'close'};break;
 case 'subscribe':state.draft=[...state.subs];go('subscribe',1);focus={action:'draft',value:'shan'};break;
 case 'confirmSubs':if(!state.draft.length)return;state.subs=[...state.draft];state.day=0;state.filter='all';go('calendar',2);notify('已加入市集上新，可随时修改订阅');focus={action:'manage'};break;
 case 'skip':go('calendar',2);focus={action:'subscribe'};break;
 case 'calendar':go('calendar',2);focus={action:'reminders'};break;
 case 'day':state.day=Number(v);break;
 case 'agendaMonth':state.agendaOffset=Math.max(-12,Math.min(12,state.agendaOffset+Number(v)));state.day=1;focus={action:'agendaMonth',value:v};break;
 case 'agendaToday':state.agendaOffset=0;state.day=Math.floor(state.now/1440);focus={action:'day',value:String(state.day)};break;
 case 'agendaFilter':state.agendaFilter=v;break;
 case 'filter':state.filter=v;break;
 case 'railPrev':moveRail(v,-1);return;
 case 'railNext':moveRail(v,1);return;
 case 'store':{state.store=v;state.event=el.closest('.aj-event')?.dataset.eventCard||Object.values(events).find(ev=>ev.owner===v).id;state.detailBack='calendar';go('store',3);focus={action:'calendar'};break;}
 case 'event':openEvent(v);focus={action:state.detailBack};break;
 case 'product':focusReturn={action:a,value:v};openProduct(v);focus={action:'close'};break;
 case 'remind':{const active=state.reminders.includes(v),live=events[v].type==='live';state.reminders=active?state.reminders.filter(id=>id!==v):[...state.reminders,v];notify(active?live?'已取消直播预约':'已取消开售提醒':live?'已加入预约日历，开播时提醒你（演示）':'已加入预约日历，开售时提醒你（演示）');break;}
 case 'cancelReminder':state.reminders=state.reminders.filter(id=>id!==v);notify(events[v].type==='live'?'已取消直播预约':'已取消开售提醒');focus={action:'day',value:String(state.day)};break;
 case 'saveProduct':state.saved=state.saved.includes(v)?state.saved.filter(id=>id!==v):[...state.saved,v];notify(state.saved.includes(v)?'已加入心动单品清单':'已从心动单品清单移除');break;
 case 'variant':state.variant=Number(v);break;
 case 'addBag':{const p=products[state.product],variant=p.variants[state.variant];if(state.variant===null||!variant||variant.stock===0||state.now<releaseOf(p))return;if(state.bag.some(i=>i.pid===p.id&&i.variant===state.variant)){notify('这个规格已在购物袋中');}else{state.bag.push({pid:p.id,variant:state.variant});notify('已加入购物袋');}state.modal=null;focus={action:'bag'};break;}
 case 'bag':go('bag',5);focus={action:state.bag.length?'checkout':'calendar'};break;
 case 'removeItem':{const [pid,vi]=v.split(':');state.bag=state.bag.filter(i=>!(i.pid===pid&&i.variant===Number(vi)));notify('已移除商品');focus={action:state.bag.length?'checkout':'calendar'};break;}
 case 'checkout':if(!state.bag.length)return;go('checkout',5);focus={action:'placeOrder'};break;
 case 'placeOrder':if(!state.bag.length)return;state.orders.push({items:state.bag.map(i=>({...i})),total:totals().total});state.orders=state.orders.slice(-5);state.bag=[];go('success',5);focus={action:'calendar'};break;
 case 'manage':go('manage',6);focus={action:'calendar'};break;
 case 'saved':go('saved');focus={action:'calendar'};break;
 case 'reminders':openAgenda();focus={action:'day',value:String(state.day)};break;
 case 'remindersBack':go('reminders',2);focus={action:'day',value:String(state.day)};break;
 case 'toggleSub':if(state.subs.includes(v)){focusReturn={action:a,value:v};state.target=v;state.modal='unsubscribe';focus={action:'close'};}else{state.subs.push(v);notify('已订阅，后续更新收录到市集上新');}break;
 case 'confirmUnsub':state.subs=state.subs.filter(id=>id!==v);state.modal=null;notify('已取消上新订阅，账号仍然关注');focus={action:'toggleSub',value:v};break;
 case 'close':state.modal=null;focus=focusReturn;break;
 case 'advanceLaunch':setTime(timeOf(events.shan));go('calendar',4);notify('演示已推进至新品开售');focus={action:'reminders'};break;
 case 'advanceLive':{const id=events[state.event]?.type==='live'?state.event:state.arrivedFromNote?'moge':'buyer';setTime(timeOf(events[id])+5);openEvent(id);notify('演示已推进至买手开播');focus={action:'calendar'};break;}
 case 'toggleDelay':state.delayed=!state.delayed;state.modal=null;if(state.screen==='success')go('calendar',4);notify(state.delayed?'演示：开售延期，日历与本次提醒同步更新':'演示：恢复原开售时间');focus=standalone?{action:'tools'}:{action:a};break;
 }
 render(focus);save();
});
root.addEventListener('keydown',e=>{if(!state.modal)return;if(e.key==='Escape'){e.preventDefault();state.modal=null;render(focusReturn);save();return;}if(e.key==='Tab'){const nodes=[...phone.querySelectorAll('.aj-sheet button:not(:disabled), .aj-sheet input:not(:disabled)')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('openai:set_globals',e=>{const snapshot=e.detail?.globals?.widgetState;if(snapshot&&JSON.stringify(snapshot.privateContent)!==JSON.stringify(state)){restore(snapshot);render();}});
render();
})();
</script>
