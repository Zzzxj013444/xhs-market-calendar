<script>
(() => {
  const key = 'xhs-market-calendar:demo:v2';
  const legacyKey = 'codex:visualization-widget-state-v2:' + JSON.stringify([location.pathname, location.search]);
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(key) || localStorage.getItem(legacyKey) || 'null'); } catch {}
  window.openai = {
    widgetState: saved,
    async setWidgetState(next) {
      const snapshot = JSON.parse(JSON.stringify(next));
      this.widgetState = snapshot;
      try { localStorage.setItem(key, JSON.stringify(snapshot)); } catch {}
    }
  };
  window.addEventListener('storage', event => {
    if (event.key !== key) return;
    try {
      const snapshot = JSON.parse(event.newValue || 'null');
      window.openai.widgetState = snapshot;
      window.dispatchEvent(new CustomEvent('openai:set_globals', {detail: {globals: {widgetState: snapshot}}}));
    } catch {}
  });
})();
</script>

/* Deployed site layout. The original inline preview retains its natural height. */
html[data-arrivals-site] {
  color-scheme: light dark;
  background: light-dark(#f7f5f3, #171718);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
html[data-arrivals-site], html[data-arrivals-site] body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
html[data-arrivals-site] body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
html[data-arrivals-site] button { touch-action: manipulation; }
html[data-arrivals-site] #arrival-journey { height: 100vh; height: 100dvh; }
html[data-arrivals-site] #arrival-journey .aj-workbench { height: 100%; padding: 18px 12px; }
html[data-arrivals-site] #arrival-journey .aj-preview { height: 100%; min-height: 0; display: flex; flex-direction: column; }
html[data-arrivals-site] #arrival-journey .aj-phone { flex: 1; min-height: 0; overflow: hidden; }
html[data-arrivals-site] #arrival-journey .aj-screen,
html[data-arrivals-site] #arrival-journey .aj-phone:has(.aj-overlay) .aj-screen {
  height: 100%; min-height: 0; max-height: none; overflow: hidden;
}
html[data-arrivals-site] #arrival-journey .aj-screen > .aj-status,
html[data-arrivals-site] #arrival-journey .aj-screen-head,
html[data-arrivals-site] #arrival-journey .aj-screen-foot { flex: 0 0 auto; background: var(--aj-bg); }
html[data-arrivals-site] #arrival-journey .aj-scroll {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: clip;
  overscroll-behavior-y: contain; scrollbar-width: thin; -webkit-overflow-scrolling: touch;
}
html[data-arrivals-site] #arrival-journey .aj-screen-foot { box-shadow: 0 -4px 20px #00000004; }
html[data-arrivals-site] #arrival-journey .aj-phone:has(.aj-overlay) .aj-screen-foot { box-shadow: none; }
html[data-arrivals-site] #arrival-journey .aj-overlay { overflow: hidden; }
html[data-arrivals-site] #arrival-journey .aj-sheet {
  max-height: calc(100% - 12px); overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch; padding-bottom: 22px;
}
html[data-arrivals-site] #arrival-journey .aj-sheet-head { position: sticky; top: -19px; background: var(--aj-bg); z-index: 1; padding-top: 6px; }
html[data-arrivals-site] #arrival-journey .aj-sheet .aj-sku-actions { position: sticky; bottom: -22px; padding: 12px 0; background: var(--aj-bg); }
html[data-arrivals-site] #arrival-journey .aj-sheet .aj-close { min-width: 44px; min-height: 44px; }
html[data-arrivals-site] #arrival-journey .aj-person-info { overflow-wrap: anywhere; }
html[data-arrivals-site] #arrival-journey .aj-mobile-bar { display: none; }
html[data-arrivals-site] #arrival-journey .aj-tools-heading { font-size: 13px; font-weight: 500; margin: 22px 0 12px; }
html[data-arrivals-site] #arrival-journey .aj-tools-stages { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
html[data-arrivals-site] #arrival-journey .aj-tools-stage { border-radius: 11px; background: var(--aj-soft); min-height: 46px; padding: 9px; display: flex; align-items: center; gap: 8px; font-size: 13px; }
html[data-arrivals-site] #arrival-journey .aj-tools-stage span { font-size: 11px; color: var(--aj-muted); }
html[data-arrivals-site] #arrival-journey .aj-tools-stage[aria-pressed=true] { background: var(--aj-pink); color: var(--aj-red); }
html[data-arrivals-site] #arrival-journey .aj-tools-time { display: grid; gap: 8px; }
html[data-arrivals-site] #arrival-journey .aj-tools-reset { margin-top: 18px; }

@media (max-width: 700px), (max-width: 1000px) and (max-height: 500px) {

  html[data-arrivals-site] #arrival-journey { display: flex; flex-direction: column; }

    display: flex; flex: 0 0 auto; align-items: center; justify-content: space-between;
    min-height: 44px; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));

 55 25L55 10Z" fill="url(#aj-star-shine)"/></g><g transform="rotate(9 101 94)"><rect x="79" y="72" width="40" height="43" rx="7" fill="#2d8bb3" opacity=".18" transform="translate(2 3)"/><rect x="79" y="72" width="40" height="43" rx="7" fill="url(#aj-page-fill)"/><path d="M79 79A7 7 0 0 1 86 72H112A7 7 0 0 1 119 79V84H79V79Z" fill="#ffec7e"/><path d="M89 70V76M108 70V76" stroke="#fffef4" stroke-width="4" stroke-linecap="round"/><text x="99" y="106" text-anchor="middle" fill="#217aaf" font-family="Georgia,serif" font-size="24">13</text></g></svg><span class="aj-promo-spark spark-a"></span><span class="aj-promo-spark spark-b"></span></span><span class="aj-promo-copy"><span class="aj-promo-new">NEW</span><span class="aj-promo-title">上新日历</span><span class="aj-promo-subtitle">喜欢的店和人，上新一起看</span></span><span class="aj-promo-cta">${state.subs.length?'我的上新':'去订阅'}${ico('chevron-right')}</span>`,'aj-arrivals-promo','',`aria-label="上新日历：${state.subs.length?'查看我的上新':'选择上新订阅'}"`);}
function market(){return `${marketHeader('market')}<div class="aj-body">${arrivalsBanner()}<div class="aj-section-row"><h3>随手逛，也有小惊喜</h3><span class="aj-subtle">日常好物</span></div><div class="aj-rec-grid">${['mug','coat'].map(id=>{const p=products[id];return button('product',`${art(id)}<h3>${p.name}<br>${id==='mug'?'给早晨留一杯咖啡的时间':'初冬日常，也可以很轻盈'}</h3><div class="aj-rec-meta"><span>${p.seller}</span><b>¥${p.price}</b></div>`,'aj-rec-item',id);}).join('')}</div></div>${nav()}`;}
function subscribe(){return `${stageTop('选择上新订阅','market','manage')}<div class="aj-body"><div class="aj-intro-title">想看谁的下一次上新？</div><div class="aj-intro-copy">这些是你已关注、且发布商品更新的账号。<br>选择后，在市集集中看它们的上新与选品。</div>${Object.values(owners).map(o=>`<div class="aj-candidate"><label>${avatar(o.id)}<span class="aj-person-info"><span class="aj-person-name">${o.name}<span class="aj-kind">${o.kind}</span></span><span class="aj-person-meta">${o.relation}</span></span><input type="checkbox" class="aj-check" data-action="draft" data-value="${o.id}" aria-label="订阅${o.name}的${o.sub}" ${state.draft.includes(o.id)?'checked':''}></label><div class="aj-candidate-preview">${art(o.products[0])}${art(o.products[1])}<p>${o.sub}<br>${o.brief}</p></div></div>`).join('')}</div><div class="aj-footer-action">${button('confirmSubs',`加入我的上新${state.draft.length?`（${state.draft.length}）`:''}`,'aj-primary aj-full','',state.draft.length?'':'disabled')}<p class="aj-subtle">账号关注保持原样；单次开售提醒另外设置。</p>${button('skip','先逛逛，稍后再选','aj-text-link')}</div>`;}
function gallery(ev,prices=true){return `<div class="aj-gallery">${ev.pids.map(id=>button('product',art(id)+(prices?`<div class="aj-gallery-price">¥${products[id].price}</div>`:''),'',id,`aria-label="查看${products[id].name}"`)).join('')}</div>`;}
function eventCard(ev){const o=owners[ev.owner],st=statusOf(ev);return `<article class="aj-event"><div class="aj-person-row">${avatar(o.id)}<div class="aj-person-info"><div class="aj-person-name">${o.name}<span class="aj-kind">${o.type==='buyer'?'买手':'店铺'}</span></div><div class="aj-person-meta">${date(timeOf(ev))} ${ev.type==='live'?'开播':'开售'}</div></div><span class="aj-event-status ${st}">${statusLabel(ev)}</span></div><div class="aj-event-title">${ev.title}</div><div class="aj-event-desc">${ev.type==='live'?'本期选品':'本次新品'} · ${ev.pids.length} 款 · ${ev.desc}</div>${state.delayed&&ev.id==='shan'?'<div class="aj-notice neutral">开售调整至 11.14 20:00，已设提醒随之更新。</div>':''}${gallery(ev)}<div class="aj-event-actions">${button('event',`看本次${ev.type==='live'?'选品':'新品'} ${ico('chevron-right')}`,'aj-text-link',ev.id)}${st==='upcoming'?button('remind',ico(state.reminders.includes(ev.id)?'bell-check':'bell')+(state.reminders.includes(ev.id)?'已设提醒':ev.type==='live'?'提醒开播':'提醒开售'),'aj-secondary'+(state.reminders.includes(ev.id)?' selected':''),ev.id):button('event',st==='live'?'进入选品直播':'展开看看','aj-secondary',ev.id)}</div><div class="${state.seen.includes(ev.id)?'aj-seen':'aj-unseen'}">${state.seen.includes(ev.id)?'已浏览本期':'本期还没看'}</div></article>`;}
function empty(title,copy,action,label){return `<div class="aj-empty"><div class="aj-empty-icon">${ico('calendar-heart')}</div><h3>${title}</h3><p>${copy}</p>${action?button(action,label,'aj-primary'):''}</div>`;}
function calendar(){const selected=Object.values(events).filter(e=>state.subs.includes(e.owner));const filtered=selected.filter(e=>(!state.day||Math.floor(timeOf(e)/1440)===state.day)&&(state.filter==='all'||owners[e.owner].type===state.filter)).sort((a,b)=>{const af=timeOf(a)>=state.now,bf=timeOf(b)>=state.now;return af===bf?(af?timeOf(a)-timeOf(b):timeOf(b)-timeOf(a)):af?-1:1;});const currentDay=Math.floor(state.now/1440);const ready=state.reminders.filter(id=>state.now>=timeOf(events[id]));return `${marketHeader('calendar')}<div class="aj-cal-heading"><h3>11 月<span>我的上新日历</span></h3>${button('allDays',state.day?'查看近期全部':'近期全部','aj-text-link')}</div><div class="aj-days" role="group" aria-label="选择日期">${[12,13,14,15,16,17,18].map((d,i)=>{const count=selected.filter(e=>Math.floor(timeOf(e)/1440)===d).length;return button('day',`<span>${['四','五','六','日','一','二','三'][i]}</span><b>${d}</b><small>${count?count+'场':d===currentDay?'今天':'·'}</small>`,'aj-day'+(d===currentDay?' today':''),String(d),`aria-pressed="${state.day===d}" aria-label="11月${d}日，${count}场更新"`);}).join('')}</div><div class="aj-filter-row" role="group" aria-label="发布者类型">${[['all','全部'],['shop','店铺'],['buyer','买手']].map(([id,label])=>button('filter',label,'aj-filter',id,`aria-pressed="${state.filter===id}"`)).join('')}<span class="aj-subtle">已订阅 ${state.subs.length} 个</span></div>${ready.length?`<div style="padding:0 16px">${button('reminders',`${ico('bell-ring')}<div><strong>你设的 ${ready.length} 场提醒已有更新</strong><p>回到之前想看的上新与选品</p></div>${ico('chevron-right')}`,'aj-collection-row')}</div>`:''}${state.saved.length?`<div style="padding:0 16px">${button('saved',`${ico('heart')}<div><strong>收藏了 ${state.saved.length} 件心动单品</strong><p>${state.saved.filter(id=>state.now>=releaseOf(products[id])).length} 件已可购买</p></div>${ico('chevron-right')}`,'aj-collection-row')}</div>`:''}<div class="aj-feed">${!state.subs.length?empty('把喜欢的店和人放进来','关注账号不会自动订阅上新。先选几个想持续追踪的店铺或买手。','subscribe','选择上新订阅'):filtered.length?filtered.map(eventCard).join(''):empty('这一天暂时没有安排','可以看看近期其他上新，也可以调整订阅。','allDays','看近期全部')}</div>${nav()}`;}
function productRow(id){const p=products[id],available=state.now>=releaseOf(p);return `<div class="aj-product-row">${art(id)}<div class="aj-product-info"><h3>${p.name}</h3><p>${p.note}<br>销售店铺：${p.seller}</p><div class="aj-product-price-row"><span class="aj-price">¥${p.price}</span>${button('product',available?'选规格':'看详情','aj-mini-button',id)}</div></div>${button('saveProduct',ico(state.saved.includes(id)?'heart-handshake':'heart'),'aj-save-button'+(state.saved.includes(id)?' saved':''),id,`aria-label="${state.saved.includes(id)?'取消收藏':'收藏'}${p.name}" aria-pressed="${state.saved.includes(id)}"`)}</div>`;}
function eventPage(){const ev=events[state.event],o=owners[ev.owner],st=statusOf(ev),subbed=state.subs.includes(o.id);return `${stageTop(ev.type==='live'?'买手选品':'本次上新')}<div class="aj-body" style="padding-top:3px;padding-bottom:14px"><div class="aj-person-row">${avatar(o.id)}<div class="aj-person-info"><div class="aj-person-name">${o.name}<span class="aj-kind">${o.kind}</span></div><div class="aj-person-meta">账号已关注</div></div>${button('toggleSub',subbed?'已订阅':o.type==='buyer'?'订阅选品':'订阅上新','aj-secondary'+(subbed?' selected':''),o.id,`aria-pressed="${subbed}"`)}</div></div>${st==='live'?`<div class="aj-live-panel">${art('mug')}<span class="aj-live-label">直播中 · 画面示意</span><div class="aj-live-caption">阿梨：先看看这只杯子的容量和釉面。</div></div>`:`<div class="aj-detail-hero">${gallery(ev,false)}</div>`}<div class="aj-detail-heading"><div class="aj-eyebrow">${ev.type==='live'?'CURATED BY '+o.name:'NEW COLLECTION / 初冬'}</div><h2>${ev.title}</h2><p>${ev.desc}${ev.type==='live'?' 你可以先看商品，直播时再听具体的选品理由。':ev.id==='shan'?' 这一批有雾青外套、栗色围巾和轻便的小提袋。':' 杯子、木托盘和小花器，实用之外也有自己的纹理。'}</p><div class="aj-timing">${ico(ev.type==='live'?'video':'calendar-days')}${date(timeOf(ev))} ${ev.type==='live'?'开播':'开售'} · ${statusLabel(ev)}</div>${state.delayed&&ev.id==='shan'?'<div class="aj-old-time">原定 11.13 20:00 开售</div>':''}${ev.type==='live'?'<p style="margin-top:8px">开播时间与商品开售时间独立，已在售商品可直接购买。</p>':''}</div><div class="aj-product-list">${ev.pids.map(productRow).join('')}</div><div class="aj-footer-action">${st==='upcoming'?button('remind',ico(state.reminders.includes(ev.id)?'bell-check':'bell')+(state.reminders.includes(ev.id)?'已设置本次提醒':ev.type==='live'?'提醒我本次开播':'提醒我本次开售'),'aj-primary aj-full',ev.id):button('bag',ico('shopping-bag')+'查看购物袋','aj-primary aj-full')}<p class="aj-subtle">${st==='upcoming'?'仅提醒本次；订阅上新不会自动开启通知。':ev.type==='live'?'商品按实际销售店铺提供交易与售后服务。':'按实际规格查看库存、价格与发货信息。'}</p></div>`;}
function reminderPage(){return `${stageTop('我的提醒','manage')}<div class="aj-body">${state.reminders.length?state.reminders.map(id=>{const ev=events[id];return `<div class="aj-reminder-row"><div><h3>${owners[ev.owner].name} · ${ev.type==='live'?'选品直播':'新品开售'}</h3><p>${ev.title}<br>${date(timeOf(ev))} · ${statusLabel(ev)}</p></div>${button('event','查看','aj-secondary',id)}${button('cancelReminder',ico('x'),'aj-text-link',id,`aria-label="取消${owners[ev.owner].name}本次提醒"`)}</div>`;}).join(''):empty('还没有单次提醒','在感兴趣的预告里，单独设置本次开售或开播提醒。','calendar','去看日历')}<div class="aj-intro-copy" style="margin-top:18px">上新订阅和单次提醒分别管理。取消某次提醒，不会取消上新订阅。</div></div>`;}
function savedPage(){return `${stageTop('心动单品')}<div class="aj-body">${state.saved.length?state.saved.map(productRow).join(''):empty('还没有收藏单品','看到喜欢的款式，可以先收藏，开售后再来决定。','calendar','去看上新')}</div>`;}
function manage(){return `${stageTop('我的订阅')}<div class="aj-body"><div class="aj-notice neutral">${ico('users-round')}这些账号已关注；上新订阅由你另外选择。</div>${Object.values(owners).map(o=>`<div class="aj-manager-row"><div class="aj-person-row">${avatar(o.id)}<div class="aj-person-info"><div class="aj-person-name">${o.name}</div><div class="aj-person-meta">${o.sub} · 账号已关注</div></div>${button('toggleSub',state.subs.includes(o.id)?'已订阅':'订阅','aj-secondary'+(state.subs.includes(o.id)?' selected':''),o.id,`aria-pressed="${state.subs.includes(o.id)}" aria-label="${state.subs.includes(o.id)?'取消':'添加'}${o.name}的上新订阅"`)}</div><div class="aj-manager-note">${state.subs.includes(o.id)?'已收录到市集上新；不会自动发送开售通知。':'仅关注账号内容，暂未订阅商品更新。'}</div></div>`).join('')}<div class="aj-section-gap">${button('reminders',`${ico('bell')}<div><strong>单次提醒 · ${state.reminders.length}</strong><p>查看或取消已设置的开售、开播提醒</p></div>${ico('chevron-right')}`,'aj-collection-row')}${button('saved',`${ico('heart')}<div><strong>心动单品 · ${state.saved.length}</strong><p>开售前后，都能回到同一件商品</p></div>${ico('chevron-right')}`,'aj-collection-row')}</div></div>`;}
function groups(items=state.bag){const map={};for(const item of items){const seller=products[item.pid].seller;(map[seller]??=[]).push(item);}return Object.entries(map).map(([seller,items])=>({seller,items,shipping:seller==='山间来信'?0:6}));}
function totals(items=state.bag){const subtotal=items.reduce((n,i)=>n+products[i.pid].price,0);const shipping=groups(items).reduce((n,g)=>n+g.shipping,0);return{subtotal,shipping,total:subtotal+shipping};}
function bagGroups(readonly=false,items=state.bag){return groups(items).map(g=>`<section class="aj-bag-group"><div class="aj-bag-shop">${ico('store')}${g.seller}</div>${g.items.map(i=>{const p=products[i.pid];return `<div class="aj-product-row">${art(i.pid)}<div class="aj-product-info"><h3>${p.name}</h3><p>${p.variants[i.variant].name} · 数量 1</p><div class="aj-product-price-row"><span class="aj-price">¥${p.price}</span>${readonly?'':button('removeItem','移除','aj-text-link',i.pid+':'+i.variant)}</div></div></div>`;}).join('')}<div class="aj-bag-shipping"><span>${readonly?'付款后 48 小时内发出':'预计运费'}</span><span>${g.shipping?'¥'+g.shipping:'包邮'}</span></div></section>`).join('');}
function bag(){const t=totals();return `${stageTop('购物袋')}<div class="aj-body">${state.bag.length?bagGroups():empty('先把喜欢的一件放进来','从上新页选择商品和规格，加入购物袋。','calendar','去看上新')}</div>${state.bag.length?`<div class="aj-footer-action"><div class="aj-amount-row"><span>商品 ¥${t.subtotal} ＋ 运费 ¥${t.shipping}</span><span class="aj-price">¥${t.total}</span></div>${button('checkout','确认购买方案','aj-primary aj-full')}</div>`:''}`;}
function checkout(){const t=totals();return `${stageTop('确认订单','bag')}<div class="aj-body"><div class="aj-notice neutral">${ico('map-pin')}演示收货地址 · 上海市 · 不填写真实信息</div>${bagGroups(true)}<div class="aj-amount-row"><span>商品金额</span><span>¥${t.subtotal}</span></div><div class="aj-amount-row"><span>按店铺计算运费</span><span>¥${t.shipping}</span></div><div class="aj-amount-row total"><span>合计</span><span class="aj-price">¥${t.total}</span></div><p class="aj-subtle">各店分别发货。符合条件的商品支持 7 天无理由退货，具体以店铺规则为准。</p></div><div class="aj-footer-action">${button('placeOrder','提交模拟订单 · ¥'+t.total,'aj-primary aj-full')}<p class="aj-subtle">仅演示购买流程，不会付款或生成真实订单。</p></div>`;}
function success(){const order=state.orders[state.orders.length-1];return `${stageTop('购买完成','calendar')}<div class="aj-success"><div class="aj-success-icon">${ico('check')}</div><h2>模拟订单已完成</h2><p>从期待一次上新，到选中适合自己的那一件。</p><div class="aj-success-summary"><div class="aj-amount-row"><span>商品数量</span><span>${order.items.length} 件</span></div><div class="aj-amount-row"><span>含运费合计</span><span>¥${order.total}</span></div></div>${button('calendar','回市集，继续看上新','aj-primary aj-full')}${button('manage','管理我的上新订阅','aj-text-link')}<p>本次体验没有发生真实交易。</p></div>`;}
function modal(){if(!state.modal)return '';let title='',content='';if(state.modal==='reminder'){const ev=events[state.event],has=state.reminders.includes(ev.id);title='本次提醒';content=`<div class="aj-remind-symbol">${ico(has?'bell-check':'bell')}</div><div class="aj-sheet-title">${owners[ev.owner].name}</div><p class="aj-sheet-copy">${ev.title}<br>${date(timeOf(ev))} ${ev.type==='live'?'开播':'开售'}</p>${has?'<div class="aj-notice neutral" style="margin-top:17px">已设置本次提醒，可在「我的订阅」中管理。</div>':`<label class="aj-remind-choice"><input type="checkbox" data-action="reminderConsent" ${state.reminderConsent?'checked':''}>在站内消息提醒我，仅限本次</label><p class="aj-subtle" style="margin-bottom:16px">订阅上新与单次提醒独立，本演示不会发送实际通知。</p>`}${button(has?'cancelReminder':'confirmReminder',has?'取消本次提醒':'确认本次提醒','aj-primary aj-full',ev.id,!has&&!state.reminderConsent?'disabled':'')}`;}
else if(state.modal==='product'){const p=products[state.product],canBuy=state.now>=releaseOf(p),v=state.variant===null?null:p.variants[state.variant],saved=state.saved.includes(p.id);title='商品规格';content=`<div class="aj-sku-head">${art(p.id)}<div><h3>${p.name}</h3><span class="aj-price">¥${p.price}</span><p>销售店铺：${p.seller}</p><p>${canBuy?'已开售':date(releaseOf(p))+' 开售'}</p></div></div><div class="aj-size-label">${canBuy?'选择购买规格':'提前看看规格，开售后再决定'}</div><div class="aj-sizes" role="group" aria-label="商品规格">${p.variants.map((v,i)=>button('variant',v.name+(v.stock===0?' · 售罄':''),'aj-size',String(i),`aria-pressed="${state.variant===i}" ${v.stock===0?'disabled':''}`)).join('')}</div><div class="aj-spec-detail">${v?v.detail:'请选择规格，查看尺寸与库存状态。'}<br>${p.seller==='山间来信'?'本店包邮':'本店运费 ¥6'} · 按实际销售店铺发货</div><div class="aj-sku-actions">${button('saveProduct',ico(saved?'heart-handshake':'heart')+(saved?'已收藏':'收藏'),'aj-secondary'+(saved?' selected':''),p.id,`aria-pressed="${saved}"`)}${canBuy?button('addBag',v?'加入购物袋':'请选择规格','aj-primary','',v&&v.stock?'':'disabled'):button('remind',ico(state.reminders.includes('shan')?'bell-check':'bell')+(state.reminders.includes('shan')?'已设本次提醒':'提醒本次开售'),'aj-primary','shan')}</div>`;}
else if(state.modal==='unsubscribe'){const o=owners[state.target];title='取消上新订阅';const count=state.reminders.filter(id=>events[id].owner===o.id).length;content=`<div class="aj-person-row" style="margin-bottom:16px">${avatar(o.id)}<div class="aj-person-name">${o.name}</div></div><p class="aj-sheet-copy">取消后，新的${o.sub}不再收录到你的市集日历。<br>你仍然关注「${o.account}」的账号内容。${count?'<br>已设置的单次提醒保留，可在「我的提醒」里单独取消。':''}</p><div style="margin-top:21px">${button('confirmUnsub','确认取消上新订阅','aj-primary aj-full',o.id)}</div>`;}
else if(state.modal==='tools'){title='演示工具';content=`<p class="aj-sheet-copy">概念原型 · 商家与商品均为示例<br>演示时间：${date(state.now)}，通知与交易不会实际发生。</p><div class="aj-tools-heading">切换体验阶段</div><div class="aj-tools-stages">${stepNames.map((name,i)=>button('stage',`<span>${i+1}</span>${name}`,'aj-tools-stage',String(i),`aria-pressed="${state.step===i}"`)).join('')}</div><div class="aj-tools-heading">时间与状态</div><div class="aj-tools-time">${button('advanceLaunch',ico('calendar-check')+'推进至新品开售','aj-secondary')}${button('advanceLive',ico('video')+'查看买手开播','aj-secondary')}${button('toggleDelay',ico('clock-3')+(state.delayed?'恢复原定开售时间':'店铺延期一天'),'aj-secondary')}</div>${button('reset',ico('rotate-ccw')+'重新体验','aj-secondary aj-full aj-tools-reset')}`;}
return `<div class="aj-overlay">${button('close','','aj-shade','','aria-label="关闭弹层背景"')}<section class="aj-sheet" role="dialog" aria-modal="true" aria-labelledby="aj-dialog-title"><div class="aj-sheet-head"><h3 id="aj-dialog-title">${title}</h3>${button('close',ico('x'),'aj-close','','aria-label="关闭弹层"')}</div>${content}</section></div>`;}
function go(screen,step){state.screen=screen;if(step!==undefined)state.step=step;state.modal=null;}
function notify(message){toast=message;announcer.textContent=message;if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast='';phone.querySelector('.aj-toast')?.remove();},2600);}
function openEvent(id){state.event=id;if(!state.seen.includes(id))state.seen.push(id);go('event',3);}
function openProduct(id){state.product=id;state.variant=null;state.modal='product';}
function setTime(t){state.now=t;state.day=0;state.modal=null;}
function jump(step){state.step=step;state.modal=null;switch(step){case 0:go('market');break;case 1:state.draft=[...state.subs];go('subscribe');break;case 2:go('calendar');break;case 3:openEvent('shan');break;case 4:setTime(timeOf(events.shan));go('calendar',4);break;case 5:go('bag');break;case 6:go('manage');break;}}
function focusTo(action,value){const scope=state.modal?phone.querySelector('.aj-sheet'):root;const selector=`[data-action="${action}"]${value!==undefined&&value!==''?`[data-value="${value}"]`:''}`;scope?.querySelector(selector)?.focus({preventScroll:true});}
function screenContent(markup){
 if(!standalone)return statusBar()+markup;
 const template=document.createElement('template');template.innerHTML=markup;
 const header=[],body=[],footer=[];
 for(const node of template.content.children){
  if(node.matches('.aj-top,.aj-top-tabs'))header.push(node.outerHTML);
  else if(node.matches('.aj-bottom-nav,.aj-footer-action'))footer.push(node.outerHTML);
  else body.push(node.outerHTML);
 }
 return `${statusBar()}<header class="aj-screen-head">${header.join('')}</header><main class="aj-scroll" aria-label="${stepNames[state.step]}内容">${body.join('')}</main>${footer.length?`<footer class="aj-screen-foot">${footer.join('')}</footer>`:''}`;
}
function render(focus){
 const previousScroll=phone.querySelector('.aj-scroll');
 if(previousScroll&&renderedScreenKey)scrollPositions.set(renderedScreenKey,previousScroll.scrollTop);
 const key=state.screen+(state.screen==='event'?':'+state.event:state.screen==='calendar'?':'+state.day+':'+state.filter:'');
 rail.innerHTML=stepNames.map((name,i)=>button('stage',`<em>${String(i+1).padStart(2,'0')}</em><span>${name}</span>`,'aj-step',String(i),state.step===i?'aria-current="step"':'')).join('');
 hint.textContent=stepNotes[state.step];clockLabel.textContent='演示时间 '+date(state.now);
 const pages={market,subscribe,calendar,event:eventPage,bag,checkout,success,manage,saved:savedPage,reminders:reminderPage};
 phone.innerHTML=`<div class="aj-screen" ${state.modal?'inert':''}>${screenContent(pages[state.screen]())}</div>${modal()}${toast?`<div class="aj-toast" role="status">${toast}</div>`:''}`;
 controls.innerHTML=button('advanceLaunch','演示：推进至新品开售','aj-demo-control')+button('advanceLive','演示：买手开播','aj-demo-control')+button('toggleDelay',state.delayed?'演示：恢复原定时间':'演示：店铺延期一天','aj-demo-control');
 if(standalone){
  phone.querySelector('.aj-scroll').scrollTop=scrollPositions.get(key)||0;
  mobileBar.inert=!!state.modal;rail.parentElement.inert=!!state.modal;controls.inert=!!state.modal;
 }
 renderedScreenKey=key;
 if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
 if(focus)focusTo(focus.action,focus.value);
 if(state.modal&&!standalone)phone.querySelector('.aj-sheet')?.scrollIntoView({block:'center',behavior:'instant'});
}
root.addEventListener('change',e=>{const el=e.target;if(el.dataset.action==='draft'){state.draft=el.checked?[...new Set([...state.draft,el.dataset.value])]:state.draft.filter(id=>id!==el.dataset.value);render({action:'draft',value:el.dataset.value});save();}else if(el.dataset.action==='reminderConsent'){state.reminderConsent=el.checked;render({action:'reminderConsent'});save();}});
root.addEventListener('click',e=>{const el=e.target.closest('button[data-action]');if(!el||!root.contains(el)||el.disabled)return;const a=el.dataset.action,v=el.dataset.value;let focus={action:a,value:v};
 switch(a){
 case 'tools':focusReturn={action:'tools'};state.modal='tools';focus={action:'close'};break;
 case 'stage':jump(Number(v));focus=standalone&&window.matchMedia('(max-width:700px), (max-width:1000px) and (max-height:500px)').matches?{action:'tools'}:{action:'stage',value:v};break;
 case 'reset':state=defaults();scrollPositions.clear();renderedScreenKey='';toast='';if(toastTimer)clearTimeout(toastTimer);focus={action:'subscribe'};break;
 case 'market':go('market',0);focus={action:'calendar'};break;
 case 'subscribe':state.draft=[...state.subs];go('subscribe',1);focus={action:'draft',value:'shan'};break;
 case 'confirmSubs':if(!state.draft.length)return;state.subs=[...state.draft];state.day=0;state.filter='all';go('calendar',2);notify('已加入市集上新，可随时修改订阅');focus={action:'manage'};break;
 case 'skip':go('calendar',2);focus={action:'subscribe'};break;
 case 'calendar':go('calendar',2);focus={action:'allDays'};break;
 case 'day':state.day=Number(v);break;
 case 'allDays':state.day=0;break;
 case 'filter':state.filter=v;break;
 case 'event':openEvent(v);focus={action:'calendar'};break;
 case 'product':focusReturn={action:a,value:v};openProduct(v);focus={action:'close'};break;
 case 'remind':focusReturn={action:a,value:v};state.event=v;state.reminderConsent=true;state.modal='reminder';focus={action:'close'};break;
 case 'confirmReminder':if(!state.reminderConsent)return;state.reminders=[...new Set([...state.reminders,v])];state.modal=null;notify('已设置本次站内提醒（演示）');focus=focusReturn;break;
 case 'cancelReminder':state.reminders=state.reminders.filter(id=>id!==v);state.modal=null;notify('已取消本次提醒，上新订阅保持原样');focus=state.screen==='reminders'?{action:'manage'}:focusReturn;break;
 case 'saveProduct':state.saved=state.saved.includes(v)?state.saved.filter(id=>id!==v):[...state.saved,v];notify(state.saved.includes(v)?'已收藏，开售后可以继续看':'已取消收藏');break;
 case 'variant':state.variant=Number(v);break;
 case 'addBag':{const p=products[state.product],variant=p.variants[state.variant];if(state.variant===null||!variant||variant.stock===0||state.now<releaseOf(p))return;if(state.bag.some(i=>i.pid===p.id&&i.variant===state.variant)){notify('这个规格已在购物袋中');}else{state.bag.push({pid:p.id,variant:state.variant});notify('已加入购物袋');}state.modal=null;focus={action:'bag'};break;}
 case 'bag':go('bag',5);focus={action:state.bag.length?'checkout':'calendar'};break;
 case 'removeItem':{const [pid,vi]=v.split(':');state.bag=state.bag.filter(i=>!(i.pid===pid&&i.variant===Number(vi)));notify('已移除商品');focus={action:state.bag.length?'checkout':'calendar'};break;}
 case 'checkout':if(!state.bag.length)return;go('checkout',5);focus={action:'placeOrder'};break;
 case 'placeOrder':if(!state.bag.length)return;state.orders.push({items:state.bag.map(i=>({...i})),total:totals().total});state.orders=state.orders.slice(-5);state.bag=[];go('success',5);focus={action:'calendar'};break;
 case 'manage':go('manage',6);focus={action:'calendar'};break;
 case 'saved':go('saved');focus={action:'calendar'};break;
 case 'reminders':go('reminders');focus={action:'manage'};break;
 case 'toggleSub':if(state.subs.includes(v)){focusReturn={action:a,value:v};state.target=v;state.modal='unsubscribe';focus={action:'close'};}else{state.subs.push(v);notify('已订阅，后续更新收录到市集上新');}break;
 case 'confirmUnsub':state.subs=state.subs.filter(id=>id!==v);state.modal=null;notify('已取消上新订阅，账号仍然关注');focus={action:'toggleSub',value:v};break;
 case 'close':state.modal=null;focus=focusReturn;break;
 case 'advanceLaunch':setTime(timeOf(events.shan));go('calendar',4);notify('演示已推进至新品开售');focus={action:'allDays'};break;
 case 'advanceLive':setTime(timeOf(events.buyer)+5);openEvent('buyer');notify('演示已推进至买手开播');focus={action:'calendar'};break;
 case 'toggleDelay':state.delayed=!state.delayed;state.modal=null;if(state.screen==='success')go('calendar',4);notify(state.delayed?'演示：开售延期，日历与本次提醒同步更新':'演示：恢复原开售时间');focus=standalone?{action:'tools'}:{action:a};break;
 }
 render(focus);save();
});
root.addEventListener('keydown',e=>{if(!state.modal)return;if(e.key==='Escape'){e.preventDefault();state.modal=null;render(focusReturn);save();return;}if(e.key==='Tab'){const nodes=[...phone.querySelectorAll('.aj-sheet button:not(:disabled), .aj-sheet input:not(:disabled)')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('openai:set_globals',e=>{const snapshot=e.detail?.globals?.widgetState;if(snapshot&&JSON.stringify(snapshot.privateContent)!==JSON.stringify(state)){restore(snapshot);render();}});
render();
})();
</script>

<script src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js" defer></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  window.lucide?.createIcons({attrs: {width: 18, height: 18}});
});
</script>
